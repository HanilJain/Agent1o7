[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fw-audit"
version = "0.1.0"
description = "Agentic Firmware Vulnerability Detection System (Stage 1: Ingestion & Pre-processing)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SUTD Agent1o7" }]

# Core runtime deps: keep the always-required set small.
# `langchain` (the meta-package) owns `langchain.chat_models.init_chat_model`,
# the provider-agnostic model factory `fw_audit.config.llm_config` builds on.
dependencies = [
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Install only the LLM providers you actually use.
ollama = ["langchain-ollama>=1.0.0"]
anthropic = ["langchain-anthropic>=1.0.0"]
google = ["langchain-google-genai>=2.0.0"]
# OpenAI-compatible endpoints: OpenAI itself, and any locally-hosted server that
# speaks the OpenAI API (vLLM, LM Studio) via `Settings.openai_base_url`.
openai = ["langchain-openai>=1.0.0"]
all = [
    "langchain-ollama>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=1.0.0",
]
# Stage 2's tree-sitter-based function extraction (fw_audit.stage2_extraction.clean),
# consumed by Stage 3's chunking via the persisted cleaned/ artifact.
# Optional: cleaning is skipped with a per-binary warning (Joern normalization and
# stage2_summary.json still succeed) without this; Stage 3 targets without a cleaned
# artifact become SkippedTargets, never a hard failure.
# Pinned to a matched 0.23.x pair, not just "latest": tree-sitter 0.26.0 paired with
# tree-sitter-c 0.24.2 (the latest of each independently) produces CORRUPTED Node
# fields (observed: start_point.row returning ~4*10^11 for real nodes) that crash the
# process outright on real ~6MB input — an ABI mismatch between the two independently
# versioned packages, not a bug in this codebase. Confirmed tree-sitter==0.23.2 +
# tree-sitter-c==0.23.2 together are correct (sane row numbers, no crash, full file
# parses in ~10s). Re-verify with the same reproduction before ever bumping either.
stage2 = ["tree-sitter==0.23.2", "tree-sitter-c==0.23.2"]
# Alias kept for backward compatibility with `pip install -e ".[stage3]"` — cleaning
# moved from Stage 3 into Stage 2 (see stage2_extraction.clean), but the install
# command shouldn't silently break for anyone still using the old extra name.
stage3 = ["tree-sitter==0.23.2", "tree-sitter-c==0.23.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
fw-ingest = "fw_audit.stage1_ingestion.runner:main"
fw-extract = "fw_audit.stage2_extraction.runner:main"
fw-analyze = "fw_audit.stage3_analysis.runner:main"

[tool.setuptools.packages.find]
include = ["fw_audit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests against a real firmware image (skipped if absent).",
]

[tool.coverage.run]
source = ["fw_audit"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
# docker/ghidra_scripts/ runs inside Ghidra's own PyGhidra/JPype process,
# not this project's venv — `currentProgram`, `monitor`, `getScriptArgs`,
# and Java package imports (`java.io`, `ghidra.*`, `jpype`) only exist
# there, so neither ruff nor mypy can meaningfully check it against this
# project's environment.
extend-exclude = ["docker/ghidra_scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
# See the matching note under [tool.ruff]: docker/ghidra_scripts/ runs
# inside Ghidra's own PyGhidra process, not this project's venv.
exclude = ["^docker/ghidra_scripts/"]
